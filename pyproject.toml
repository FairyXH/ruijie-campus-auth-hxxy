[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ruijie-campus-auth-hxxy"
version = "0.2.0"
description = "Cross-platform Ruijie-compatible EAP-MD5 campus network supplicant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scapy>=2.6,<3"]

[project.urls]
Homepage = "https://github.com/FairyXH/ruijie-campus-auth-hxxy"
Repository = "https://github.com/FairyXH/ruijie-campus-auth-hxxy.git"

[project.scripts]
ruijie-auth = "ruijie_auth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
